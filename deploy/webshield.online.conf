# /etc/nginx/sites-available/webshield.online
#
# The static marketing site at the root, with WordPress still alive behind it.
#
# ── Why it is shaped like this ────────────────────────────────────────────────
#
# Before this change the whole vhost was one `location / { proxy_pass ... }` into
# the WordPress container. That is still here, as the named location `@wordpress`,
# and it is the *fallback* rather than the default. So:
#
#   GET /            -> public/index.html      (static)
#   GET /privacy     -> public/privacy.html    (static, via $uri.html)
#   GET /assets/...  -> public/assets/...      (static)
#   GET /wp-admin/   -> no such static file    -> @wordpress
#   GET /shop        -> no such static file    -> @wordpress
#   GET /?p=123      -> no such static file    -> @wordpress
#
# The point of the fallback rather than a list of WordPress paths is that nothing
# has to be enumerated. The blog, the store, the media library, wp-json, the login
# page and every plugin endpoint keep working without anyone having to remember
# them, and a page we have not built yet degrades to whatever WordPress was
# serving before instead of to a 404.
#
# ── Rolling back ──────────────────────────────────────────────────────────────
#
# Comment out the `root`/`try_files` block and restore `location / { proxy_pass
# http://wordpress_backend; ... }`. The WordPress install is untouched — it is
# still running, still at /opt/wordpress/www, and its database has not been
# migrated or rewritten. Nothing here is one-way.
#
# Backup taken before the first deploy of this file:
#   /opt/backups/wordpress-20260813-140254/   (files, database, vhosts, SHA256SUMS)

upstream wordpress_backend {
    server localhost:8080;
    keepalive 32;
}

# HTTP: ACME validation, everything else to HTTPS.
#
# NOTE: port 80 is currently denied by one of the two NSGs in front of this box
# (see PROJECT.md §3.8), so this server block is not actually reachable from the
# internet today. It is kept correct so that opening the port is a firewall
# change and not also a config change.
server {
    listen 80;
    listen [::]:80;
    server_name webshield.online www.webshield.online *.webshield.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Canonical host. Added with the static site: the page posts to
# api.webshield.online from JavaScript, and the API's CORS allow-list names the
# apex only. Without this redirect a visitor who typed "www." would get a form
# that fails with a CORS error and no explanation. Folding www into the apex is
# better than widening the allow-list — one origin is one thing to reason about.
server {
    # nginx 1.24 on this box: http2 goes on the listen line. The standalone
    # `http2 on;` directive needs 1.25.1+ and is an "unknown directive" here —
    # dns.webshield.online carries the same note for the same reason. Keep the
    # options identical to the other vhosts on this address, or nginx warns about
    # protocol options being redefined for 0.0.0.0:443.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.webshield.online;

    ssl_certificate     /etc/letsencrypt/live/webshield.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webshield.online/privkey.pem;

    return 301 https://webshield.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webshield.online *.webshield.online;

    ssl_certificate     /etc/letsencrypt/live/webshield.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webshield.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/webshield.online.access.log;
    error_log  /var/log/nginx/webshield.online.error.log;

    client_max_body_size 100M;

    # ---- the static site ----------------------------------------------------
    root /opt/webshield-site/public;
    index index.html;

    # `$uri.html` is what makes /privacy work without a trailing slash or a
    # directory. `@wordpress` is the last resort, not the first.
    location / {
        try_files $uri $uri.html $uri/ @wordpress;
    }

    # ⚠️ `expires`, never `add_header`, in the blocks below.
    #
    # nginx's add_header does NOT accumulate down the tree: a location that
    # declares even one add_header discards every add_header inherited from the
    # server block. Setting Cache-Control that way here would have silently
    # dropped HSTS, X-Frame-Options, nosniff and Referrer-Policy from the two
    # pages people actually load — and nothing would have complained. `expires`
    # emits Cache-Control without touching inheritance, so the security headers
    # above survive.

    # Fingerprint-free filenames, so these are cached for a week rather than a
    # year: a week is short enough that a copy fix reaches people, and long
    # enough that a repeat visitor fetches nothing. Revisit if the build ever
    # starts hashing filenames.
    location ^~ /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # The font files effectively never change — their names carry the family and
    # the unicode subset, so a different font would be a different file.
    location ^~ /assets/fonts/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The two HTML pages must not be cached hard, or a copy correction takes a
    # week to reach anyone who has already visited.
    location = / {
        expires 5m;
        try_files /index.html =404;
    }

    location = /privacy {
        expires 5m;
        try_files /privacy.html =404;
    }

    # ---- WordPress, still running behind all of the above --------------------
    location @wordpress {
        proxy_pass http://wordpress_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # wp-admin and wp-login are POST-heavy and must never be answered from a
    # static try_files miss with a GET-shaped fallback. Sending them straight to
    # the backend also keeps the admin working if /opt/webshield-site is ever
    # empty or mid-deploy.
    location ^~ /wp-admin/  { try_files /dev/null @wordpress; }
    location ^~ /wp-content/ { try_files /dev/null @wordpress; }
    location ^~ /wp-includes/ { try_files /dev/null @wordpress; }
    location ^~ /wp-json/   { try_files /dev/null @wordpress; }
    location = /wp-login.php { try_files /dev/null @wordpress; }
    location = /xmlrpc.php   { try_files /dev/null @wordpress; }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
